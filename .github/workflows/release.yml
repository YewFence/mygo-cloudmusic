# Pushing a tag such as v0.2.0 builds the apps of macOS, Windows and
# Linux, signs them and their updates, and uploads them to a draft
# release of the tag, which is published by hand: installed apps update
# to it then.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mygo build uploads to the release of mygo.json's version, whichever
      # tag started the workflow.
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      # mygo build puts the version's section of CHANGELOG.md in the update
      # manifests, which the update window shows; the release page gets the
      # same notes, in place of GitHub's from the pull requests.
      - name: Take the notes from the changelog
        run: |
          awk -v heading="## ${GITHUB_REF_NAME#v}" '
            /^## / { inside = ($0 == heading); next }
            inside
          ' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
          - { name: Flatpak, os: ubuntu-latest, platform: "", flatpak-arch: x86_64 }
          - { name: FlatpakArm, os: ubuntu-24.04-arm, platform: "", flatpak-arch: aarch64 }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # The flatpak build dates each version of the changelog by its
          # tag, or, for a tag the clone does not have, by the commit
          # that added the version to the changelog: both need the
          # history, which a shallow clone does not have.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Generate the vendor directory, for the Flatpak build
        if: startsWith(matrix.name, 'Flatpak')
        run: go mod vendor
      # The certificate signs the app; the notary profile, "notary" in
      # mygo.json, notarizes its disk image. Both go in a keychain of the
      # job, made the default one, where codesign and notarytool look.
      - name: Import the certificate and the notary credentials
        if: matrix.name == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          security default-keychain -d user -s "$keychain"
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      # Flatpak builds in its own sandbox from the manifest, fed by a
      # prepare step that derives the package's version metadata (the
      # ldflags and the metainfo's releases) from mygo.json and
      # CHANGELOG.md, so a release needs no step of its own beyond writing
      # the changelog. The result is a single-file bundle per arch, with
      # checksums, users install without a remote.
      - name: Build the Flatpak bundle
        if: startsWith(matrix.name, 'Flatpak')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak dbus-x11
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Ubuntu's flatpak-builder (1.4.2 on noble) predates the freedesktop
          # 25.08 SDK's libdir layout, so modules land in /app/lib64 where no
          # other module looks (flathub/shared-modules#330); Flathub's own
          # builder is current.
          flatpak --user install -y flathub org.flatpak.Builder
          go run ./packaging/flatpak/gen packaging/flatpak
          cd packaging/flatpak
          # dbus-launch gives flatpak a session bus: without one, installing
          # the SDK dependency tries to autolaunch over X11, absent on a
          # headless runner.
          dbus-launch flatpak run org.flatpak.Builder --arch "${{ matrix.flatpak-arch }}" --user --install-deps-from=flathub \
            --force-clean --repo=repo build dev.egoist.cloudmusic.yaml
          version="$(jq -r .version ../../mygo.json)"
          flatpak build-bundle repo "dev.egoist.cloudmusic-$version-${{ matrix.flatpak-arch }}.flatpak" \
            dev.egoist.cloudmusic master
          sha256sum "dev.egoist.cloudmusic-$version-${{ matrix.flatpak-arch }}.flatpak" \
            > "SHA256SUMS-flatpak-${{ matrix.flatpak-arch }}"
      - name: Upload the Flatpak bundle
        if: startsWith(matrix.name, 'Flatpak')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packaging/flatpak
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            dev.egoist.cloudmusic-*.flatpak "SHA256SUMS-flatpak-${{ matrix.flatpak-arch }}" --clobber
      - name: Build and upload
        if: ${{ !startsWith(matrix.name, 'Flatpak') }}
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload
